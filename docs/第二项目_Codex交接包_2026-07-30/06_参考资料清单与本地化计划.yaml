  may_reclassify_priority_with_reasoning: true
  may_propose_removing_irrelevant_or_duplicate_sources: true
  may_not:
    - "把本地已有资料自动升级为当前实现任务"
    - "未经用户接受直接克隆外部仓库"
    - "未经用户接受修改或删除用户资料"
    - "未经许可证核验直接移植代码"
