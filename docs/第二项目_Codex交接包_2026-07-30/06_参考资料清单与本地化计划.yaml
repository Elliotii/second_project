recommended_reference_structure:
  root: "reference/"
  note: "以下是建议结构，不代表当前本地实际存在。Codex 应基于真实仓库调整。"
  directories:
    - path: "reference/SOURCE_MANIFEST.yaml"
      purpose: "实际资料清单、版本、许可证和用途"
    - path: "reference/knowledge/cc-harness-knowledge/"
      purpose: "用户知识库"
    - path: "reference/upstreams/claude-code-source-mirror/"
      purpose: "源码镜像；真实路径由 Codex 核验"
    - path: "reference/upstreams/SearchCLI/"
      purpose: "经用户授权后才加入"
    - path: "reference/upstreams/Youtu-Agent/"
      purpose: "V2/V3 前经用户授权后加入"
    - path: "reference/papers/"
      purpose: "核心论文 PDF 与项目相关摘要"
    - path: "reference/analyses/"
      purpose: "有界源码或论文适配分析"
    - path: "reference/adaptation/ADAPTATION_CANDIDATES.md"
      purpose: "待评估的模块移植候选"
    - path: "reference/adaptation/PORTED_MODULES.md"
      purpose: "已采用、移植或重写模块的来源与验证"
    - path: "reference/adaptation/REJECTED_PATTERNS.md"
      purpose: "不适合当前项目的模式及重新考虑条件"

