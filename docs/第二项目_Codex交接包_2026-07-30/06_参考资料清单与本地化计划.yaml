acquisition_principles:
  - principle_id: "problem_before_source"
    rule: "先明确当前或下一版本需要解决的问题，再决定是否获取资料。"
  - principle_id: "source_is_not_goal"
    rule: "获取仓库、论文或文章不自动创建实现 Goal。"
  - principle_id: "pinned_and_traceable"
    rule: "源码仓库本地化后应固定 Commit 或 Release，并记录许可证和来源。"
  - principle_id: "bounded_research"
    rule: "每次源码研究必须限定模块、问题、输出和停止条件。"
  - principle_id: "reuse_is_allowed"
    rule: "许可证允许且适配价值明确时，可以直接依赖、移植、跨语言重写或行为仿写。"
  - principle_id: "no_originality_purity"
    rule: "个人贡献边界用于准确归因，不用于强迫从零重复开发。"
  - principle_id: "no_premature_platformization"
    rule: "不得因未来 V3/V4 方向提前获取并整合大型控制平台。"
  - principle_id: "codex_agency_with_evidence"
    rule: "Codex 可以根据真实本地状态和源码内容调整本计划，但必须给出证据、版本关系和用户决策点。"

